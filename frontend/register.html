<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechCore IT - Register</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="logo">
      <h1>TechCore IT</h1>
      <p>Create an Account</p>
    </div>

    <form id="register-form">
      <div class="form-group">
        <label for="full_name">Full Name <span class="required">*</span></label>
        <input type="text" id="full_name" name="full_name"
               placeholder="Enter your full name" required />
      </div>

      <div class="form-group">
        <label for="email">Email Address <span class="required">*</span></label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email address" required />
      </div>

      <div class="form-group">
        <label for="username">Username <span class="required">*</span></label>
        <input type="text" id="username" name="username"
               placeholder="Choose a username" required />
      </div>

      <div class="form-group">
        <label for="password">Password <span class="required">*</span></label>
        <input type="password" id="password" name="password"
               placeholder="At least 8 characters" required />
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm Password <span class="required">*</span></label>
        <input type="password" id="confirm_password" name="confirm_password"
               placeholder="Re-enter your password" required />
      </div>

      <p class="register-note">
        Your account will be created with standard user access.
        Contact an administrator if you need elevated permissions.
      </p>

      <div id="error-msg" class="error-msg hidden"></div>
      <div id="success-msg" class="success-msg hidden"></div>

      <button type="submit" class="btn btn-primary btn-full">Create Account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Log In</a></p>
  </div>

  <script>
    // If already logged in, go to dashboard
    fetch('/api/auth/me')
      .then(res => res.json())
      .then(data => { if (data.user) window.location.href = 'dashboard.html'; })
      .catch(() => {});

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl   = document.getElementById('error-msg');
      const successEl = document.getElementById('success-msg');
      errorEl.classList.add('hidden');
      successEl.classList.add('hidden');

      const password        = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm_password').value;

      if (password !== confirmPassword) {
        errorEl.textContent = 'Passwords do not match.';
        errorEl.classList.remove('hidden');
        return;
      }

      const body = {
        full_name: document.getElementById('full_name').value.trim(),
        email:     document.getElementById('email').value.trim(),
        username:  document.getElementById('username').value.trim(),
        password
      };

      try {
        const res  = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();

        if (res.ok) {
          successEl.textContent = data.message + ' Redirecting to login...';
          successEl.classList.remove('hidden');
          document.getElementById('register-form').reset();
          setTimeout(() => window.location.href = 'login.html', 2000);
        } else {
          errorEl.textContent = data.error || 'Registration failed.';
          errorEl.classList.remove('hidden');
        }
      } catch (err) {
        errorEl.textContent = 'Could not connect to server.';
        errorEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
